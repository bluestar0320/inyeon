name: APK 만들기

# 직접 확인해 볼 수 있도록 설치 파일을 만든다.
# 웹 배포가 본진이고 이건 곁가지다 — 그래서 자동으로 돌지 않고 눌러야 돈다.
on:
  workflow_dispatch:

# 코드를 읽기만 한다. 혹시 단계 하나가 털려도 저장소를 고치지 못하게.
permissions:
  contents: read

jobs:
  apk:
    name: 정식 서명 APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8은 JDK 21을 쓴다.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # APK 안에 파일을 통째로 넣으므로 하위 경로가 없다. BASE_PATH를 비운다.
      - name: 웹 빌드
        run: npm run build
        env:
          BASE_PATH: ""

      # android/ 폴더는 설정에서 그대로 만들어지므로 저장소에 두지 않는다.
      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx cap sync android

      # cap add 는 Capacitor 기본 아이콘을 깐다. 웹에 설치할 때 쓰는 시계 아이콘으로 덮는다.
      # 적응형 아이콘의 앞 그림은 가장자리가 잘려 나가므로, 여백이 넉넉한 maskable 판을 쓴다.
      # 크기는 512 하나로 두고 안드로이드가 줄여 쓰게 한다.
      - name: 앱 아이콘
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp public/icon-512.png "$d/ic_launcher.png"
            cp public/icon-512.png "$d/ic_launcher_round.png"
            cp public/icon-maskable.png "$d/ic_launcher_foreground.png"
          done

      # 정식(release) 키로 서명한다. 키는 저장소에 두지 않고 Actions 비밀값으로만 받는다.
      #
      # 예전에는 저장소에 둔 공개 디버그 키를 썼다. 그 키는 누구나 내려받을 수 있어
      # 똑같이 서명된 가짜 APK가 진짜 앱을 덮어쓰고 기록을 읽을 수 있었다.
      # 디버그 빌드는 USB 디버깅으로 앱 데이터를 꺼낼 수도 있었다.
      #
      # 키는 한 번 정하면 바꾸지 않는다 — 안드로이드는 서명이 다른 앱을 기존 앱
      # 위에 설치하지 않는다. 원본은 저장소 밖에 백업해 둔다(signing/README.md).
      #
      # android/ 는 CI가 그때그때 만드는 폴더라 저장소에 없다. 그래서 만든 뒤에
      # 덧붙인다. Gradle은 android 블록을 여러 번 써도 합쳐 준다.
      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 비밀값이 없다"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file("$RUNNER_TEMP/release.p12")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "inyeon"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: 빌드
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 서명이 실제로 그 키인지 본다. 조용히 다른 키(또는 서명 없음)로 나가면
      # 설치가 막히고, 그때는 원인을 찾느라 한참을 헤맨다.
      - name: 서명 확인
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          EXPECTED=$(keytool -list -v -keystore "$RUNNER_TEMP/release.p12" -storepass "$KEYSTORE_PASSWORD" -alias inyeon             | grep 'SHA256:' | tr -d ' 	' | cut -d: -f2- | tr -d ':')
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK"             | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          echo "기대: $EXPECTED"
          echo "실제: $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: inyeon-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
