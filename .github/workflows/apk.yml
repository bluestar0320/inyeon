name: APK 만들기

# 직접 확인해 볼 수 있도록 설치 파일을 만든다.
# 웹 배포가 본진이고 이건 곁가지다 — 그래서 자동으로 돌지 않고 눌러야 돈다.
on:
  workflow_dispatch:

jobs:
  apk:
    name: 디버그 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8은 JDK 21을 쓴다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 서명 키를 고정한다.
      #
      # 안 그러면 Gradle이 실행할 때마다 ~/.android/debug.keystore를 새로 만든다.
      # CI는 매번 빈 기계라 빌드마다 키가 달라지고, 안드로이드는 서명이 다른 앱을
      # 기존 앱 위에 설치하지 않는다 — 새 APK를 깔려면 매번 지워야 했고 그때 기록도
      # 같이 날아갔다.
      #
      # 저장소에 둔 키는 디버그용이다. 구글 플레이에 올리거나 갱신하는 데 쓸 수 없고,
      # 비밀번호도 안드로이드 관례값(android)이라 애초에 비밀이 아니다. 나중에
      # 정식 배포를 하게 되면 그때는 별도의 릴리스 키를 비밀값으로 넣어야 한다.
      - name: 서명 키 놓기
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:'

      - run: npm ci

      # APK 안에 파일을 통째로 넣으므로 하위 경로가 없다. BASE_PATH를 비운다.
      - name: 웹 빌드
        run: npm run build
        env:
          BASE_PATH: ""

      # android/ 폴더는 설정에서 그대로 만들어지므로 저장소에 두지 않는다.
      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx cap sync android

      - name: 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 결과 확인
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: inyeon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
