name: APK 만들기

# 직접 확인해 볼 수 있도록 설치 파일을 만든다.
# 웹 배포가 본진이고 이건 곁가지다 — 그래서 자동으로 돌지 않고 눌러야 돈다.
on:
  workflow_dispatch:

jobs:
  apk:
    name: 디버그 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Capacitor 8은 JDK 21을 쓴다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # APK 안에 파일을 통째로 넣으므로 하위 경로가 없다. BASE_PATH를 비운다.
      - name: 웹 빌드
        run: npm run build
        env:
          BASE_PATH: ""

      # android/ 폴더는 설정에서 그대로 만들어지므로 저장소에 두지 않는다.
      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx cap sync android

      # 서명 키를 고정한다.
      #
      # 안 그러면 Gradle이 빌드할 때마다 디버그 키를 새로 만든다. CI는 매번 빈
      # 기계라 빌드마다 키가 달라지고, 안드로이드는 서명이 다른 앱을 기존 앱 위에
      # 설치하지 않는다 — 새 APK를 깔려면 매번 지워야 했고 그때 기록도 날아갔다.
      #
      # 처음에는 ~/.android/debug.keystore 자리에 놓아 뒀는데, 로그를 보니 키는
      # 제대로 놓였지만 Gradle이 그걸 쓰지 않았다(러너에서는 기본 탐색 경로가
      # 다른 데를 본다). 경로를 맞히려 하지 말고 빌드 설정에 직접 박는다.
      #
      # android/ 는 CI가 그때그때 만드는 폴더라 저장소에 없다. 그래서 만든 뒤에
      # 덧붙인다. Gradle은 android 블록을 여러 번 써도 합쳐 준다.
      - name: 서명 키 고정
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -14 android/app/build.gradle

      - name: 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 결과 확인
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # 서명이 실제로 고정 키인지 본다. 말로만 고정해 두고 다음 빌드에서 조용히
      # 달라지면 설치가 또 막히고, 그때는 원인을 찾느라 한참을 헤맨다.
      - name: 서명 확인
        run: |
          EXPECTED=$(keytool -list -v -keystore signing/debug.keystore             -storepass android -alias androiddebugkey             | grep 'SHA256:' | tr -d ' 	' | cut -d: -f2-)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs             android/app/build/outputs/apk/debug/app-debug.apk             | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          EXPECTED_HEX=$(echo "$EXPECTED" | tr -d ':')
          echo "기대: $EXPECTED_HEX"
          echo "실제: $ACTUAL"
          test "$EXPECTED_HEX" = "$ACTUAL"

      - uses: actions/upload-artifact@v4
        with:
          name: inyeon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
