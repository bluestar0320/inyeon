name: App Store 빌드

# 서명한 iOS 빌드를 만들어 App Store Connect(TestFlight)에 올린다.
# 맥이 없으니 GitHub의 맥에서 만든다. 눌러야 돈다.
#
# 미리 해 둘 것(애플 개발자 계정이 생긴 뒤 한 번):
#  1. Certificates, IDs & Profiles에서 번들 ID `app.inyeon.counter` 등록
#  2. App Store Connect에서 그 번들 ID로 앱 「몇번더」 만들기
#  3. App Store Connect → 사용자 및 액세스 → 통합 → API 키(역할: 앱 관리) 만들기
#  4. Actions 비밀값 넣기
#     - APPLE_TEAM_ID: 팀 ID(10자리)
#     - ASC_KEY_ID: API 키 ID
#     - ASC_ISSUER_ID: 발급자 ID
#     - ASC_KEY_P8_BASE64: 내려받은 AuthKey_XXXX.p8 파일을 base64로 바꾼 것
# 인증서와 프로비저닝 프로필은 xcodebuild가 API 키로 알아서 만들고 고른다(자동 서명).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: 서명 빌드와 업로드
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 웹 빌드
        run: npm run build
        env:
          BASE_PATH: ""

      - name: iOS 프로젝트 생성
        run: |
          xcodebuild -version
          bash scripts/ios-native.sh

      - name: API 키 준비
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          test -n "$ASC_KEY_P8_BASE64" || { echo "ASC_KEY_P8_BASE64 비밀값이 없다"; exit 1; }
          echo "$ASC_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"

      # 빌드 번호는 올릴 때마다 커져야 한다. 이 워크플로의 실행 번호를 쓴다. 보이는 판은 package.json에서.
      - name: 아카이브
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$(node -p 'require("./package.json").version')" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -30
          test -d "$RUNNER_TEMP/App.xcarchive"

      # destination=upload 이면 내보내면서 바로 App Store Connect에 올린다.
      - name: 내보내기와 업로드
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      - name: 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
