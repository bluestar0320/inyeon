name: 검사

on:
  push:
  pull_request:
  workflow_dispatch:

# 코드를 읽기만 한다. 혹시 단계 하나가 털려도 저장소를 고치지 못하게.
permissions:
  contents: read

jobs:
  # 브라우저가 필요 없는 검사. 빠르게 돌아 대부분의 실수를 여기서 잡는다.
  # 러너는 ubuntu-latest 대신 24.04에 묶어 둔다. latest가 26으로 넘어가면
  # Playwright가 브라우저 의존 패키지를 못 깔 수 있다 — 지원을 확인한 뒤 올린다.
  check:
    name: 타입·단위 테스트
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 단위 테스트가 Node 내장 타입 스트리핑으로 lib/calc.ts를 그대로 불러 돌린다.
          # 22.18 미만에서는 동작하지 않는다.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 계산 엔진 단위 테스트
        run: npm test

  e2e:
    name: 브라우저 시나리오·접근성
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 브라우저는 매번 받으면 느리다. Playwright 버전이 바뀔 때만 다시 받는다.
      - name: Playwright 버전 확인
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: 브라우저 설치
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 브라우저 의존 패키지만 설치
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts의 webServer가 정적 파일을 만들어 띄운다.
      # 배포와 같은 방식으로 띄워야 테스트가 의미를 갖는다.
      - name: E2E
        run: npm run test:e2e

      - name: 실패 기록 남기기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
