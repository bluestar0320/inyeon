name: iOS 시뮬레이터 확인

# 맥이 없으니 GitHub의 맥에서 iOS 앱을 빌드하고 시뮬레이터로 띄워 본다.
# 서명하지 않는 시뮬레이터용 빌드라 애플 계정이 없어도 된다. 결과는 스크린샷과
# 시뮬레이터용 앱(.app, Appetize 같은 곳에 올려 브라우저로 만져 볼 수 있다).
# 스토어용 서명 빌드는 애플 계정이 생긴 뒤에 따로 붙인다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS 시뮬레이터 (${{ matrix.ios }})
    runs-on: macos-latest
    # 최신 iOS와 앱이 받는 가장 낮은 iOS(16.4, Next 16이 Safari 16.4+) 둘 다 본다.
    strategy:
      fail-fast: false
      matrix:
        ios: [latest, "16.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 웹 빌드
        run: npm run build
        env:
          BASE_PATH: ""

      # 시뮬레이터는 누를 수 없으니 확인 스크립트가 예시 기록을 넣고 카드 줄을 직접 움직여 본다.
      # 이 빌드에만 넣는다(.github/ios-probe.js). 스토어용 빌드에는 들어가지 않는다.
      - name: 확인 스크립트 넣기
        run: |
          cp .github/ios-probe.js out/ios-probe.js
          sed -i '' 's|</head>|<script src="/ios-probe.js"></script></head>|' out/index.html
          grep -q ios-probe out/index.html

      # ios/ 폴더도 android/처럼 설정에서 만든다. 저장소에 두지 않는다.
      - name: iOS 프로젝트 생성
        run: |
          xcodebuild -version
          npx cap add ios
          npx cap sync ios

      # 앱스토어 아이콘은 1024 한 장(투명 없이). 모서리는 iOS가 깎는다.
      - name: 앱 아이콘과 Info.plist
        run: |
          d=ios/App/App/Assets.xcassets/AppIcon.appiconset
          f=$(ls "$d"/*.png | head -1)
          node -e "require('sharp')('public/icon-maskable.png').resize(1024,1024).flatten({background:'#24252d'}).png().toFile(process.argv[1])" "$f"
          # 켜는 순간의 화면도 Capacitor 로고 대신 시계로(scripts/native-splash.mjs).
          node scripts/native-splash.mjs ios/App/App/Assets.xcassets/Splash.imageset/*.png
          P=ios/App/App/Info.plist
          # 암호화는 HTTPS뿐이라 수출 규정 문서가 필요 없다.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          # 내보낸 백업 파일을 「파일」 앱에서 볼 수 있게.
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$P"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$P"
          # Next 16이 만드는 스크립트는 Safari 16.4 이상을 바란다. iOS 웹뷰는 iOS 판과 같이 가므로
          # 그보다 낮은 iPhone에는 아예 설치되지 않게 한다(템플릿 기본은 15.0 — 빈 화면이 뜬다).
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.4;/g' ios/App/App.xcodeproj/project.pbxproj
          ! grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15' ios/App/App.xcodeproj/project.pbxproj

      - name: 시뮬레이터용 빌드
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -20
          test -d build/Build/Products/Debug-iphonesimulator/App.app

      # 이 맥에 iOS 16.4 시뮬레이터가 없으면 애플에서 받아 iPhone 14를 하나 만든다.
      - name: iOS 16.4 시뮬레이터 준비
        if: matrix.ios == '16.4'
        run: |
          xcrun simctl list runtimes | grep -q "iOS 16.4" || sudo xcodebuild -downloadPlatform iOS -buildVersion 16.4
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes -j | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).runtimes.find(r=>r.version.startsWith('16.4')).identifier))")
          xcrun simctl create "iPhone 14 (16.4)" com.apple.CoreSimulator.SimDeviceType.iPhone-14 "$RT" > udid.txt

      # 고른 iPhone 시뮬레이터에 깔고 띄워, 확인 스크립트가 도는 동안 5초마다 화면을 찍는다.
      - name: 시뮬레이터에서 실행
        run: |
          if [ -f udid.txt ]; then UDID=$(cat udid.txt); else
          UDID=$(xcrun simctl list devices available -j | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const all=Object.entries(JSON.parse(s).devices).filter(([r])=>r.includes('iOS')).sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true}));
              const phones=all.at(-1)[1].filter(d=>/^iPhone \d+( Pro)?$/.test(d.name));
              console.log((phones.at(-1)||all.at(-1)[1][0]).udid)})"); fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" app.inyeon.counter
          mkdir -p shots
          for t in 05 10 15 20 25 30 35 40; do sleep 5; xcrun simctl io "$UDID" screenshot "shots/t$t.png"; done
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/dark.png
          (cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/shots/App-simulator.zip" App.app)

      - uses: actions/upload-artifact@v7
        with:
          name: inyeon-ios-simulator-${{ matrix.ios }}
          path: shots/
          retention-days: 30
